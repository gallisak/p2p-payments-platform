services:
  ledger-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger}
      POSTGRES_DB: ledger
    ports:
      - '5433:5432'
    volumes:
      - ledger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledger -d ledger']
      interval: 2s
      timeout: 5s
      retries: 30

  payments-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
      POSTGRES_DB: payments
    ports:
      - '5434:5432'
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payments -d payments']
      interval: 2s
      timeout: 5s
      retries: 30

  notifications-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications}
      POSTGRES_DB: notifications
    ports:
      - '5435:5432'
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notifications -d notifications']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  ledger-service:
    build: ./apps/ledger-service
    env_file:
      - path: ./apps/ledger-service/.env
        required: false
    environment:
      DATABASE_HOST: ledger-db
      DATABASE_PORT: '5432'
      DATABASE_USER: ledger
      DATABASE_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger}
      DATABASE_NAME: ledger
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-only-internal-key}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ledger.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dev-only-admin-password}
    depends_on:
      ledger-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3001:3001'

  payments-service:
    build: ./apps/payments-service
    env_file:
      - path: ./apps/payments-service/.env
        required: false
    environment:
      DATABASE_HOST: payments-db
      DATABASE_PORT: '5432'
      DATABASE_USER: payments
      DATABASE_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
      DATABASE_NAME: payments
      REDIS_URL: redis://redis:6379
      LEDGER_SERVICE_URL: http://ledger-service:3001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-only-internal-key}
    depends_on:
      payments-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ledger-service:
        condition: service_started
    ports:
      - '3002:3002'

  notifications-service:
    build: ./apps/notifications-service
    env_file:
      - path: ./apps/notifications-service/.env
        required: false
    environment:
      DATABASE_HOST: notifications-db
      DATABASE_PORT: '5432'
      DATABASE_USER: notifications
      DATABASE_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications}
      DATABASE_NAME: notifications
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret}
    depends_on:
      notifications-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3003:3003'

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      MEMORY_MAX_TRACES: '10000'
    ports:
      - '127.0.0.1:16686:16686'

  bff:
    build: ./apps/bff
    env_file:
      - path: ./apps/bff/.env
        required: false
    environment:
      LEDGER_SERVICE_URL: http://ledger-service:3001
      PAYMENTS_SERVICE_URL: http://payments-service:3002
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3003
      JAEGER_QUERY_URL: http://jaeger:16686
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      - ledger-service
      - payments-service
      - notifications-service
    ports:
      - '3004:3004'

  frontend:
    build: ./apps/frontend
    env_file:
      - path: ./apps/frontend/.env
        required: false
    environment:
      BFF_URL: http://bff:3004
    depends_on:
      - bff
    ports:
      - '3000:3000'

volumes:
  ledger-db-data:
  payments-db-data:
  notifications-db-data:
  redis-data:
