name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ledger-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ledger-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/ledger-service/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests (Postgres)
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: ledger
          DATABASE_PASSWORD: ledger
        run: npm run test:int
      - run: npm run build
      - run: test -f dist/main.js
      - name: Smoke test (boots against Postgres)
        env:
          PORT: 3001
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: ledger
          DATABASE_PASSWORD: ledger
          DATABASE_NAME: ledger
          JWT_ACCESS_SECRET: ci-access
          JWT_REFRESH_SECRET: ci-refresh
          INTERNAL_API_KEY: ci-internal
        run: |
          node dist/main > /tmp/ledger.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3001/auth/login \
              -H 'Content-Type: application/json' -d '{}') && [ "$code" = 400 ] && exit 0
            sleep 1
          done
          cat /tmp/ledger.log
          exit 1

  payments-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/payments-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/payments-service/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: test -f dist/main.js

  notifications-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/notifications-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/notifications-service/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: test -f dist/main.js

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run build
