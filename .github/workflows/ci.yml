name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ledger-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ledger-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/ledger-service/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests (Postgres)
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: ledger
          DATABASE_PASSWORD: ledger
          REDIS_URL: redis://localhost:6379
        run: npm run test:int
      - run: npm run build
      - run: test -f dist/main.js
      - name: Smoke test (boots against Postgres)
        env:
          PORT: 3001
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: ledger
          DATABASE_PASSWORD: ledger
          DATABASE_NAME: ledger
          JWT_ACCESS_SECRET: ci-access
          JWT_REFRESH_SECRET: ci-refresh
          INTERNAL_API_KEY: ci-internal
          REDIS_URL: redis://localhost:6379
        run: |
          node dist/main > /tmp/ledger.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3001/auth/login \
              -H 'Content-Type: application/json' -d '{}') && [ "$code" = 400 ] && exit 0
            sleep 1
          done
          cat /tmp/ledger.log
          exit 1

  payments-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/payments-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/payments-service/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests (Postgres)
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: payments
          DATABASE_PASSWORD: payments
          REDIS_URL: redis://localhost:6379
        run: npm run test:int
      - run: npm run build
      - run: test -f dist/main.js
      - name: Smoke test (boots against Postgres)
        env:
          PORT: 3002
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: payments
          DATABASE_PASSWORD: payments
          DATABASE_NAME: payments
          JWT_ACCESS_SECRET: ci-access
          INTERNAL_API_KEY: ci-internal
          LEDGER_SERVICE_URL: http://localhost:3001
          REDIS_URL: redis://localhost:6379
        run: |
          node dist/main > /tmp/payments.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:3002/transfers) && [ "$code" = 401 ] && exit 0
            sleep 1
          done
          cat /tmp/payments.log
          exit 1

  notifications-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/notifications-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notifications
          POSTGRES_PASSWORD: notifications
          POSTGRES_DB: notifications
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notifications"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/notifications-service/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests (Postgres + Redis)
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: notifications
          DATABASE_PASSWORD: notifications
          REDIS_URL: redis://localhost:6379
        run: npm run test:int
      - run: npm run build
      - run: test -f dist/main.js
      - name: Smoke test (boots against Postgres and Redis)
        env:
          PORT: 3003
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: notifications
          DATABASE_PASSWORD: notifications
          DATABASE_NAME: notifications
          JWT_ACCESS_SECRET: ci-access
          REDIS_URL: redis://localhost:6379
        run: |
          node dist/main > /tmp/notifications.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:3003/activity) && [ "$code" = 401 ] && exit 0
            sleep 1
          done
          cat /tmp/notifications.log
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [ledger-service, payments-service, notifications-service]
    env:
      COMPOSE: docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4
      - name: Start ledger, payments and notifications with their databases and Redis
        run: $COMPOSE up -d --build ledger-service payments-service notifications-service
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npm run lint:ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - name: Wait for the services
        run: |
          for i in $(seq 1 60); do
            l=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3001/auth/login -H 'Content-Type: application/json' -d '{}')
            p=$(curl -s -o /dev/null -w '%{http_code}' localhost:3002/transfers)
            n=$(curl -s -o /dev/null -w '%{http_code}' localhost:3003/health)
            [ "$l" = 400 ] && [ "$p" = 401 ] && [ "$n" = 200 ] && exit 0
            sleep 2
          done
          $COMPOSE ps
          exit 1
      - name: End-to-end tests
        run: npm test
        working-directory: e2e
      - name: Double-spend load test
        run: npm run load
        working-directory: e2e
      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color ledger-service payments-service notifications-service
